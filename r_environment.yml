name: R_shared
# Shared R environment for the HAV pipeline.
#
# Created at $HOME/.conda/R_shared by scripts/setup_havdev_env.sh and used by
# every R step in the pipeline (the scripts call
# "$HOME/.conda/R_shared/bin/Rscript"). Kept separate from the HAVDEV tools
# environment on purpose.
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  # ── R base ───────────────────────────────────────────────────────────────
  - r-base
  - r-tidyverse            # dplyr, readr, ggplot2, stringr, purrr, tidyr
  - r-seqinr               # FASTA reading/writing
  - r-rmarkdown            # batch_report.Rmd rendering
  - r-knitr                # R Markdown engine
  - r-jsonlite             # JSON parsing (tree.json, nextclade.ndjson)

  # ── Phylogenetics & visualization ─────────────────────────────────────────
  - r-ape                  # phylogenetic tree handling
  - r-phangorn             # SNP distances, tree utilities
  - bioconductor-ggtree    # phylogenetic tree visualization
  - bioconductor-ggmsa     # multiple sequence alignment visualization
  - bioconductor-msa       # MSA computation (ClustalW, MUSCLE)
  - bioconductor-biostrings # Biostrings:: helpers used in report alignment views

  # ── Report formatting ──────────────────────────────────────────────────────
  - r-kableextra           # styled HTML/LaTeX tables
  - r-scales               # axis scaling helpers
  - r-patchwork            # composing multi-panel ggplots
  - r-pheatmap             # SNP distance heatmaps

  # ── Database ─────────────────────────────────────────────────────────────
  - r-dbi                  # database interface
  - r-rsqlite              # SQLite driver (externe_sek/externe.db)
