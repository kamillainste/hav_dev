name: HAVDEV
channels:
  - bioconda
  - conda-forge
  - defaults
dependencies:
  # ── Core bioinformatics tools ─────────────────────────────────────────────
  - nextclade              # viral genome alignment and clade assignment
  - augur                  # phylogenetic pipeline (align, tree, ancestral, clades, export)
  - iqtree                 # maximum-likelihood phylogenetic tree inference
  - mafft                  # multiple sequence alignment
  - blast                  # BLAST+ suite (blastn, makeblastdb, blastdbcmd)
  - seqkit                 # FASTA/Q manipulation and statistics

  # ── R lives in a separate environment ─────────────────────────────────────
  # All R / report packages are defined in r_environment.yml and installed into
  # $HOME/.conda/R_shared by scripts/setup_havdev_env.sh. The pipeline calls R
  # via "$HOME/.conda/R_shared/bin/Rscript", not from this environment.

  # ── Python utilities ─────────────────────────────────────────────────────
  - python
  - biopython              # sequence parsing used by pipeline scripts
  - pandas                 # tabular data manipulation in Python scripts

  # ── CLI helpers used by shell scripts ───────────────────────────────────
  - jq                     # JSON parsing in helper scripts
