# ViroConstrictor 1.6.6 + Apptainer. The pipeline's patch is made for exactly
# this ViroConstrictor version (setup.sh checks it). Apptainer comes from
# conda-forge so no system install (or sudo) is needed; ViroConstrictor runs
# every analysis step inside its own published containers.
name: hav_viroconstrictor
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  - python=3.11
  - viroconstrictor=1.6.6
  - snakemake=9.5.1
  - apptainer>=1.4
