# NanoPlot 1.32.1 needs its 2022-era plotting stack: with a current
# matplotlib it fails ("matplotlib.cm has no attribute cmap_d").
name: hav_nanoplot
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  - python=3.7
  - nanoplot=1.32.1
  - matplotlib-base=3.5
  - seaborn=0.10.1
  - pandas=1.3
  - numpy=1.21
  - plotly=5.9
